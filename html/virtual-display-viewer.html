<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- prod<meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; worker-src 'self' blob:">prod -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>Open Worship App</title>
        <link rel="icon" type="image/png" href="/logo192.png" />
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #000;
                touch-action: manipulation;
            }
            body.is-idle {
                cursor: none;
            }
            #stage {
                position: absolute;
                left: 0;
                top: 0;
                transform-origin: 0 0;
                overflow: hidden;
                background: #000;
            }
            #wallpaper,
            #wallpaper > img,
            #wallpaper > video,
            #stage > iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                border: 0;
                object-fit: cover;
            }
            #stage > iframe {
                background: transparent;
                color-scheme: normal;
            }
            #toolbar {
                position: fixed;
                top: 12px;
                right: 12px;
                display: flex;
                gap: 8px;
                z-index: 10;
                transition: opacity 0.3s;
            }
            /* Idle, the controls fade -- all but a microphone that is on. */
            body.is-idle #toolbar > :not(#mic-button[aria-pressed='true']) {
                opacity: 0;
                pointer-events: none;
            }
            #toolbar > * {
                transition: opacity 0.3s;
            }
            #toolbar button {
                width: 44px;
                height: 44px;
                border-radius: 22px;
                border: 0;
                background: rgba(0, 0, 0, 0.55);
                color: #fff;
                display: grid;
                place-items: center;
                cursor: pointer;
            }
            #toolbar button[hidden],
            #toolbar [hidden] {
                display: none;
            }
            #toolbar button[aria-pressed='true'] {
                background: rgba(47, 111, 222, 0.9);
            }
            #mic-button[aria-pressed='true'] {
                background: rgba(220, 53, 69, 0.95);
            }
            #toolbar button[aria-pressed='true'] .icon-off,
            #toolbar button[aria-pressed='false'] .icon-on {
                display: none;
            }
            #sound-group {
                display: flex;
                align-items: center;
                gap: 6px;
                padding-right: 6px;
                border-radius: 22px;
                background: rgba(0, 0, 0, 0.35);
            }
            #sound-button {
                position: relative;
            }
            /* The other side's microphone is on. */
            #sound-button.is-remote-mic::after {
                content: '';
                position: absolute;
                top: 6px;
                right: 6px;
                width: 10px;
                height: 10px;
                border-radius: 5px;
                background: #2ecc71;
            }
            #sound-volume {
                width: 90px;
            }
            #status {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 14px;
                padding: 16px;
                text-align: center;
                color: #aaa;
                font: 16px system-ui, sans-serif;
            }
            #status[hidden],
            #retry-button[hidden] {
                display: none;
            }
            #retry-button {
                font: inherit;
                padding: 8px 18px;
                border-radius: 6px;
                border: 1px solid #2f6fde;
                background: #2f6fde;
                color: #fff;
                cursor: pointer;
            }
            #retry-button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            #empty-notice {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                pointer-events: none;
            }
            #empty-notice[hidden] {
                display: none;
            }
            /* A microphone or camera that could not be opened, said briefly. */
            #toast {
                position: fixed;
                left: 50%;
                bottom: 24px;
                transform: translateX(-50%);
                max-width: calc(100% - 32px);
                padding: 10px 16px;
                border-radius: 8px;
                background: rgba(176, 0, 32, 0.9);
                color: #fff;
                font: 15px system-ui, sans-serif;
                text-align: center;
                z-index: 20;
            }
            #toast[hidden] {
                display: none;
            }
            #empty-notice span {
                padding: 10px 18px;
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.55);
                color: #eee;
                font: 18px system-ui, sans-serif;
                text-align: center;
            }
            #code-form {
                position: fixed;
                inset: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                color: #ddd;
                font: 16px system-ui, sans-serif;
                padding: 16px;
            }
            #code-form[hidden] {
                display: none;
            }
            #code-form input,
            #code-form button {
                font: inherit;
                padding: 8px 12px;
                border-radius: 6px;
                border: 1px solid #555;
            }
            #code-form input {
                width: min(280px, 100%);
                background: #111;
                color: #fff;
            }
            #code-form button {
                background: #2f6fde;
                border-color: #2f6fde;
                color: #fff;
                cursor: pointer;
            }
            #code-error {
                color: #ff8a80;
                min-height: 1.2em;
            }
            /* "Cast to a TV": the TVs the app found, each cast from it. */
            #cast-panel {
                position: fixed;
                top: 64px;
                right: 12px;
                width: min(340px, calc(100% - 24px));
                max-height: calc(100% - 80px);
                overflow: auto;
                z-index: 15;
                padding: 10px;
                border-radius: 10px;
                background: rgba(20, 20, 20, 0.92);
                color: #eee;
                font: 15px system-ui, sans-serif;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            #cast-panel[hidden],
            #cast-panel [hidden] {
                display: none;
            }
            #cast-head,
            .cast-app-head {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #cast-head strong,
            .cast-app-head strong {
                flex: 1;
            }
            .cast-app-head strong {
                font-weight: normal;
                color: #bbb;
                font-size: 14px;
            }
            #cast-app {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding-top: 8px;
                border-top: 1px solid #333;
            }
            #cast-panel button {
                font: inherit;
                padding: 6px 12px;
                border-radius: 6px;
                border: 1px solid #2f6fde;
                background: #2f6fde;
                color: #fff;
                cursor: pointer;
            }
            #cast-panel button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            #cast-panel button.is-plain {
                background: transparent;
                border-color: #555;
                color: #ddd;
            }
            #cast-panel button.is-stop {
                background: #b00020;
                border-color: #b00020;
            }
            #cast-note {
                color: #bbb;
                font-size: 14px;
            }
            #cast-note:empty {
                display: none;
            }
            #cast-list {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            #cast-list li {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            #cast-list .cast-name {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
            }
            #cast-list .cast-name > span:first-child {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            #cast-list .cast-detail {
                font-size: 12px;
                color: #aaa;
            }
            #keep-awake {
                position: fixed;
                left: 0;
                bottom: 0;
                width: 1px;
                height: 1px;
                opacity: 0.01;
                pointer-events: none;
            }
        </style>
    </head>
    <body>
        <div id="stage"><div id="wallpaper"></div></div>
        <div id="empty-notice" role="status" hidden><span></span></div>
        <div id="toast" role="alert" hidden></div>
        <div id="status">
            <span id="status-text"></span>
            <button id="retry-button" type="button" hidden>Retry</button>
        </div>
        <form id="code-form" hidden>
            <label id="code-label" for="code-input">Connection code</label>
            <input
                id="code-input"
                type="password"
                autocomplete="off"
                maxlength="64"
                required
            />
            <button id="code-button" type="submit">Connect</button>
            <div id="code-error" role="alert"></div>
        </form>
        <div id="toolbar">
            <!-- Talk-back with the person running the display: all off
                 until pressed, shown only on a page that may use a
                 microphone (https, or that computer itself). The speaker is
                 the page's ONE sound button: the display's sound and their
                 voice, on and off together. -->
            <!-- Cast to a TV: the TVs the app finds on its network, and the
                 browser's own picker where it can play the stream. -->
            <button id="cast-button" type="button" aria-pressed="false" hidden>
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11z"/></svg>
            </button>
            <button id="mic-button" type="button" aria-pressed="false" hidden>
                <svg class="icon-on" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z"/><path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5"/></svg>
                <svg class="icon-off" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13 8c0 .564-.094 1.107-.266 1.613l-.814-.814A4 4 0 0 0 12 8V7a.5.5 0 0 1 1 0zm-5 4c.818 0 1.578-.245 2.212-.667l.718.719a5 5 0 0 1-2.43.923V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 1 0v1a4 4 0 0 0 4 4m3-9v4.879L5.158 2.037A3.001 3.001 0 0 1 11 3"/><path d="M9.486 10.607 5 6.12V8a3 3 0 0 0 4.486 2.607m-7.84-9.253 12 12 .708-.708-12-12z"/></svg>
            </button>
            <span id="sound-group" hidden>
                <button id="sound-button" type="button" aria-pressed="false">
                    <svg class="icon-on" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/><path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/><path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/></svg>
                    <svg class="icon-off" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/></svg>
                </button>
                <input id="sound-volume" type="range" min="0" max="100" value="100" hidden />
            </span>
            <button id="share-camera-button" type="button" aria-pressed="false" hidden>
                <svg class="icon-on" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.111-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2z"/></svg>
                <svg class="icon-off" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M10.961 12.365a2 2 0 0 0 .522-1.103l3.11 1.382A1 1 0 0 0 16 11.731V4.269a1 1 0 0 0-1.406-.913l-3.111 1.382A2 2 0 0 0 9.5 3H4.272zm-10.114-9A2 2 0 0 0 0 5v6a2 2 0 0 0 2 2h5.728zm9.746 11.925-10-14 .814-.58 10 14z"/></svg>
            </button>
            <button id="fullscreen-button" type="button">
                <svg id="fullscreen-icon" width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M1.5 1a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4A1.5 1.5 0 0 1 1.5 0h4a.5.5 0 0 1 0 1zM10 .5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 16 1.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5M.5 10a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 0 14.5v-4a.5.5 0 0 1 .5-.5m15 0a.5.5 0 0 1 .5.5v4a1.5 1.5 0 0 1-1.5 1.5h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5"/>
                </svg>
            </button>
        </div>
        <div id="cast-panel" role="dialog" aria-labelledby="cast-title" hidden>
            <div id="cast-head">
                <strong id="cast-title">Cast to a TV</strong>
                <button id="cast-close" class="is-plain" type="button" aria-label="Close">✕</button>
            </div>
            <!-- A TV on this device's network, through the browser. -->
            <button id="cast-picker" type="button">Cast from this browser</button>
            <div id="cast-picker-note" class="cast-detail" role="status"></div>
            <!-- A browser on the app's network: the TVs the app found there. -->
            <div id="cast-app" hidden>
                <div class="cast-app-head">
                    <strong id="cast-app-title">TVs on the app’s network</strong>
                    <button id="cast-search" class="is-plain" type="button">Search again</button>
                </div>
                <div id="cast-note" role="status"></div>
                <ul id="cast-list"></ul>
            </div>
        </div>
        <script type="module" src="/src/virtual-display-viewer.ts"></script>
    </body>
</html>
